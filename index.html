<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRGI Quiz Firebase Fix</title>
</head>
<body>

<h1>NRGI Quiz Firebase Save Enabled</h1>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8fshPvDmPgtQ3aKJypQN9fsN2BuY6oNU",
  authDomain: "nrgi-quiz.firebaseapp.com",
  projectId: "nrgi-quiz",
  storageBucket: "nrgi-quiz.firebasestorage.app",
  messagingSenderId: "177460239198",
  appId: "1:177460239198:web:6e92bb2f778c5f1b4b4dcf"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function saveQuizResponse() {

  const userName = "Syed Ahraz Test";
  const scorePercentage = 64;
  const passed = false;
  const completionCode = "TEX-SA-270526-N-2125";
  const formattedDate = new Date().toLocaleDateString('en-GB');

  try {

    await addDoc(collection(db, "quizResponses"), {
      name: userName,
      score: scorePercentage + "%",
      outcome: passed ? "PASSED" : "NOT YET PASSED",
      completionCode: completionCode,
      date: formattedDate,
      submittedAt: new Date().toISOString()
    });

    alert("Quiz response saved to Firestore!");
    console.log("Quiz response saved to Firestore!");

  } catch (error) {

    console.error("Error saving to Firestore:", error);
    alert("Firestore Error: " + error.message);

  }
}

document.addEventListener("DOMContentLoaded", () => {

  const button = document.createElement("button");
  button.innerText = "COPY RECORD TO CLIPBOARD";
  button.style.padding = "12px 20px";
  button.style.fontSize = "16px";
  button.style.cursor = "pointer";

  button.addEventListener("click", saveQuizResponse);

  document.body.appendChild(button);

});
</script>

</body>
</html>
